<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alight PC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">

    <!-- ═══════════════════════════════════════════ TITLE BAR ══ -->
    <div class="titlebar" id="titlebar">
      <div class="titlebar-drag-region"></div>
      <div class="titlebar-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <polygon points="12,2 22,19 2,19" fill="#7c3aed" opacity="0.9"/>
          <polygon points="12,7 19,19 5,19" fill="#a855f7" opacity="0.6"/>
        </svg>
        <span>Alight PC</span>
      </div>
      <div class="titlebar-project" id="titlebar-project">Untitled Project</div>
      <div class="titlebar-transport">
        <button class="tb-btn" id="tb-start" title="Go to Start (Home)">⏮</button>
        <button class="tb-btn tb-play" id="tb-play" title="Play/Pause (Space)">▶</button>
        <button class="tb-btn" id="tb-end" title="Go to End (End)">⏭</button>
        <div class="tb-time" id="tb-time">00:00:000</div>
        <div class="tb-fps" id="tb-fps">30 fps</div>
      </div>
      <div class="titlebar-actions">
        <button class="tb-btn tb-import" id="btn-import" title="Open XML Project">📂 Open</button>
        <button class="tb-btn" id="btn-save" title="Save XML Project">💾 Save</button>
        <button class="tb-btn tb-export" id="btn-export" title="Export Video">⬇ Export</button>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════ WORKSPACE ══ -->
    <div class="workspace" id="workspace">

      <!-- LEFT PANEL: Layer List & Asset Panel -->
      <div class="panel panel-layers" id="panel-layers">
        <div class="panel-tabs">
          <button class="tab-btn active" data-tab="layers">LAYERS</button>
          <button class="tab-btn" data-tab="assets">ASSETS</button>
        </div>

        <!-- Layers Tab Content -->
        <div class="tab-content active" id="tab-layers">
          <div class="panel-header">
            <span>LAYERS</span>
            <div style="display:flex; gap: 8px; align-items:center;">
              <button class="icon-btn" id="btn-add-layer" title="Add New Layer">+</button>
              <span class="panel-badge" id="layer-count">0</span>
            </div>
          </div>
          <div class="layer-list" id="layer-list">
            <div class="layer-empty">No layers — Open an XML project</div>
          </div>
        </div>

        <!-- Assets Tab Content -->
        <div class="tab-content" id="tab-assets">
          <div class="panel-header">
            <span>PROJECT ASSETS</span>
            <button class="icon-btn" id="btn-import-asset" title="Import Asset">+</button>
          </div>
          <div class="asset-grid" id="asset-grid">
            <div class="asset-empty">No assets in project</div>
          </div>
        </div>
      </div>

      <!-- CENTER: Viewer -->
      <div class="panel panel-viewer" id="panel-viewer">
        <div class="viewer-toolbar">
          <span class="viewer-label" id="viewer-scene-title">No Scene</span>
        </div>
        <div class="viewer-canvas-wrap" id="viewer-canvas-wrap">
          <canvas id="glcanvas"></canvas>
          
          <div class="viewer-overlay" id="viewer-overlay">
            <div class="viewer-drop-hint">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                <path d="M9 13h6m-3-3v6M5 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2h-1M9 3h6l2 4H7L9 3z" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <p>Open an XML project to begin</p>
              <button class="btn-primary" id="btn-open-hint">📂 Open Project</button>
            </div>
          </div>

          <!-- Floating Zoom Controls -->
          <div class="viewer-controls">
            <button class="v-btn" id="zoom-out" title="Zoom Out">−</button>
            <div class="v-zoom-label" id="zoom-label">100%</div>
            <button class="v-btn" id="zoom-in" title="Zoom In">+</button>
            <button class="v-btn" id="zoom-reset" title="Fit to View">⟲</button>
          </div>
        </div>
      </div>

      <!-- RIGHT PANEL: Properties -->
      <div class="panel panel-properties" id="panel-properties">
        <button class="toggle-props-btn" id="btn-toggle-props">◀</button>
        <div class="properties-wrapper">
          <div class="panel-title">Properties</div>
          <div class="properties-content" id="props-content">
            <div class="prop-empty">Select a layer</div>
          </div>
        </div>
      </div>

    </div>

    <!-- ═══════════════════════════════════════════ TIMELINE ══ -->
    <div class="timeline-section" id="timeline-section">
      <div class="timeline-header">
        <div class="tl-controls">
          <button class="icon-btn" id="btn-graph" title="Toggle Graph Editor (Ctrl+G)">📈 Graph</button>
        </div>
        <div class="tl-ruler" id="tl-ruler">
          <div class="tl-playhead" id="playhead"></div>
        </div>
      </div>
      <div class="timeline-body" id="timeline-body">
        <div class="tl-label-col" id="tl-label-col"></div>
        <div class="tl-tracks-col" id="timeline-track-area">
          <div class="tl-playhead-track" id="playhead-track"></div>
        </div>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════ GRAPH EDITOR ══ -->
    <div class="graph-panel" id="graph-editor-panel" style="display:none;">
      <div class="graph-toolbar">
        <span class="graph-title">GRAPH EDITOR</span>
        <select id="graph-property-select">
          <option value="">— Select Property —</option>
        </select>
        <span class="graph-hint">Double-click: add KF · Drag: move · Right-click: delete</span>
        <button class="icon-btn" id="btn-close-graph" style="margin-left:auto;">✕</button>
      </div>
      <div id="graph-editor-canvas-container"></div>
    </div>

    <!-- ═══════════════════════════════════════════ STATUS BAR ══ -->
    <div class="statusbar">
      <span id="status-msg">Ready</span>
      <span class="statusbar-sep">|</span>
      <span id="status-scene">No scene</span>
      <span class="statusbar-sep">|</span>
      <span id="status-layers">0 layers</span>
      <div class="statusbar-right">
        <span id="status-render">●</span>
        <span id="status-fps-live">-- fps</span>
      </div>
    </div>

    <!-- Hidden Inputs -->
    <input type="file" id="file-input" style="display:none" accept=".xml">

  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
